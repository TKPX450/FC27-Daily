name: Mise a jour quotidienne FC27

on:
schedule:
- cron: "0 17,18 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
- name: Recuperer le depot
uses: actions/checkout@v4

- name: Installer Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Installer les dependances
run: pip install requests beautifulsoup4

- name: Mise a jour des objectifs
run: |
if [ "$(TZ=Europe/Paris date +%H)" = "19" ]; then
python scripts/update_objectives.py
else
echo "Pas encore 19h en France."
exit 0
fi

- name: Enregistrer les donnees
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add data.json
if ! git diff --cached --quiet; then
git commit -m "Mise a jour quotidienne des objectifs"
git push
fi
